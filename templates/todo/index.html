<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Form Design</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 1rem;
      background: #ffffff;
    }
    .form-label {
      font-weight: 600;
    }
    .form-control {
      border: 2px solid #6a11cb;
      border-radius: 0.5rem;
      transition: 0.3s;
    }
    .form-control:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 0.2rem rgba(37, 117, 252, 0.25);
    }
    .btn-primary {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-primary:hover {
      background: linear-gradient(to right, #2575fc, #6a11cb);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg p-4">
          <div class="card-body">
            <!-- Form Title -->
            <h2 class="text-center fw-bold mb-4 text-dark">Share Your Thoughts</h2>
            <!-- Form -->
            <form action="{% url 'create_todo' %}" method="POST">
                {% csrf_token %}
              <!-- Title Input -->
              <div class="mb-3">
                <label for="title"  class="form-label text-dark">Title</label>
                <input type="text" name="title" class="form-control" id="title" placeholder="Enter a captivating title">
              </div>
              <!-- Description Input -->
              <div class="mb-4">
                <label for="description"  class="form-label text-dark">Description</label>
                <textarea name="description" class="form-control" id="description" rows="4" placeholder="Write your description here"></textarea>
              </div>
              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  Submit Now
                </button>
              </div>
            </form>

            <h2 class="text-center mb-4">Todo List</h2>
    <table class="table table-striped table-bordered table-responsive">
      <thead class="table-dark">
        <tr>
          <th scope="col">Sr.No</th>
          <th scope="col">Title</th>
          <th scope="col">Description</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Example Row 1 -->
        {% for todo in todos %}
        <tr>
          <th scope="row">{{forloop.counter}}</th>
          <td>{{todo.title}}</td>
          <td>{{todo.description}}</td>
          
          <td>
            {% if todo.completed %}
            <span class="btn btn-success btn-sm">Completed</span>
            {% else %}
            <a href="{% url 'complete_todo' todo.id %}" class="btn btn-success btn-sm ">Complete</a>
            {% endif %}
            <a href="{% url 'delete_todo' todo.id %}" class="btn btn-danger btn-sm ">Delete</a>

          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
